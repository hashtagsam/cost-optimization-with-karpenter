# Keyless Terraform CI/CD via GitHub OIDC (no AWS keys stored anywhere):
#   pull request  -> plan with the READ-ONLY role, shown in the job summary
#   nightly       -> same plan; fails (GitHub emails you) if AWS drifted from code
#   merge to main -> apply with the apply role, only after a human approves
#                    the "dev" Environment
# Repo variables: AWS_REGION, AWS_PLAN_ROLE_ARN, TF_STATE_BUCKET,
#   TF_STATE_KMS_KEY_ARN, TF_VARS (contents of terraform.tfvars)
# Environment "dev" variable: AWS_APPLY_ROLE_ARN
name: terraform
on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/envs/**"]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  id-token: write # lets a job request a GitHub OIDC token

concurrency:
  group: terraform-dev
  cancel-in-progress: false # never cancel an apply halfway

env:
  TF_INPUT: "false"
  TF_VARS: ${{ secrets.TF_VARS }} # via env, never inlined into scripts (injection-safe)
  BACKEND: >-
    -backend-config=bucket=${{ vars.TF_STATE_BUCKET }}
    -backend-config=region=${{ vars.AWS_REGION }}
    -backend-config=kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}

jobs:
  plan:
    # skip until AWS is wired up; fork PRs never get credentials
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event_name != 'push' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: terraform/envs/dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with: { role-to-assume: "${{ vars.AWS_PLAN_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.17.2", terraform_wrapper: false }
      - run: printf '%s\n' "$TF_VARS" > terraform.tfvars && terraform init $BACKEND
      - name: Plan (read-only role can't write state, so no lock)
        run: |
          set +e; terraform plan -lock=false -no-color -detailed-exitcode > plan.txt; code=$?; set -e
          { echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then echo "::error::Drift detected"; exit 1; fi

  apply:
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev # job waits for a required reviewer; only then can it get the apply role
    defaults:
      run: { working-directory: terraform/envs/dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with: { role-to-assume: "${{ vars.AWS_APPLY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.17.2", terraform_wrapper: false }
      - run: printf '%s\n' "$TF_VARS" > terraform.tfvars && terraform init $BACKEND
      - name: Apply exactly what was planned
        run: terraform plan -out=tfplan && terraform apply tfplan