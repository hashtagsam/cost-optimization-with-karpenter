# Static checks on every push/PR. No cloud credentials needed.
# Actions are pinned to commit SHAs (tags are mutable); token is read-only.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.17.2", terraform_wrapper: false }
      - run: terraform fmt -recursive -check terraform
      - run: |
          for d in terraform/bootstrap terraform/envs/dev; do
            terraform -chdir=$d init -backend=false -input=false && terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init && tflint --chdir=terraform/envs/dev --config="$PWD/.tflint.hcl"
        env: { GITHUB_TOKEN: "${{ github.token }}" }

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with: { release: v1.19.2 }
      - name: Shipped manifests must pass every guardrail policy
        run: kyverno apply platform/kyverno/policies.yaml --resource k8s/demo-app.yaml --resource k8s/inflate.yaml
      - run: shellcheck scripts/*.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - run: pipx install checkov==3.4.5 && checkov -d . --quiet --compact --config-file .checkov.yaml