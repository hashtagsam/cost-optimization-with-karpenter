# A production-shaped stateless app on the Spot-first pool.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    pod-security.kubernetes.io/enforce: restricted # reject root/privileged pods
    team: payments # cost allocation in OpenCost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
spec:
  # no replicas field: the HPA owns it
  selector:
    matchLabels: { app: podinfo }
  template:
    metadata:
      labels: { app: podinfo, team: payments }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { workload-tier: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # image declares a named user; PSA needs a numeric UID
        seccompProfile: { type: RuntimeDefault }
      # Survive a Spot reclaim or AZ loss: spread across zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: podinfo }
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: [./podinfo, --port=9898, --port-metrics=9797, --data-path=/data]
          ports:
            - { name: http, containerPort: 9898 }
            - { name: metrics, containerPort: 9797 }
          # Requests drive bin-packing. Memory limit, no CPU limit (avoids throttling)
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          lifecycle: # finish in-flight requests when a node is drained
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 64Mi }


---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
spec:
  selector: { app: podinfo }
  ports:
    - { name: http, port: 9898, targetPort: http }
---
# HPA scales pods; Karpenter scales nodes to fit them
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: podinfo
  namespace: demo
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: podinfo }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
# Karpenter honours PDBs when draining nodes
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: podinfo
  namespace: demo
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: podinfo }
---
# Zero trust: deny all traffic in the namespace, then allow only what's needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: demo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: demo
spec:
  podSelector:
    matchLabels: { app: podinfo }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 9797 }